[package]
name = "tallies"
version = "0.1.0"
edition = "2024"
license = "MIT"
# TODO: Establish MSRV
rust-version = "1.98.1"

[lib]
name = "tallies"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29.2", features = [] }

# Parser combinator library options
nom = { version = "8.0.0", features = [] }
chumsky = { version = "1.0.0-alpha.8", features = [] }

# Error macro
thiserror = { version = "2.0.20", features = [] }
